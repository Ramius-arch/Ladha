<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ladha Ledger - Real-time audited financial ledger for 1-of-1 archival streetwear drops and instant M-Pesa settlements." />

    <!-- Immediate Theme Initialization Script (Prevents flash & enforces sync) -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Google Fonts Preconnect & Optimized Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ladha Ledger | Archival Commerce Financial Hub" />
    <meta property="og:description" content="Real-time audited financial ledger for 1-of-1 archival streetwear drops and instant M-Pesa settlements." />
    <meta property="og:image" content="/assets/logo.png" />

    <title>Ladha Ledger | Archival Commerce Financial Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
